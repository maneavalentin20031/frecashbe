<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Câștigă bani jucându-te – Start</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0a;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .page-wrapper {
    width: 100%;
    max-width: 420px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 24px;
    padding-bottom: 120px;
  }

  /* Hero Card */
  .hero-card {
    background: linear-gradient(180deg, rgba(34, 197, 94, 0.08) 0%, rgba(34, 197, 94, 0.02) 100%);
    border: 1px solid rgba(34, 197, 94, 0.15);
    border-radius: 20px;
    padding: 40px 24px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .app-icon {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 8px 32px rgba(34, 197, 94, 0.25);
    overflow: hidden;
  }

  .app-icon svg {
    width: 52px;
    height: 52px;
  }

  .rating-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.25);
    border-radius: 100px;
    padding: 8px 18px;
    margin-bottom: 28px;
    font-size: 14px;
    font-weight: 500;
  }

  .stars {
    color: #facc15;
    font-size: 13px;
    letter-spacing: 1px;
  }

  .rating-score {
    color: #ffffff;
    font-weight: 700;
  }

  .rating-divider {
    color: rgba(255,255,255,0.3);
  }

  .rating-source {
    color: #22c55e;
    font-weight: 600;
  }

  .rating-count {
    color: rgba(255,255,255,0.6);
  }

  .hero-title {
    font-size: 36px;
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  .hero-title .green {
    color: #22c55e;
  }

  .hero-desc {
    font-size: 16px;
    line-height: 1.6;
    color: rgba(255,255,255,0.7);
    margin-bottom: 28px;
    max-width: 320px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(34, 197, 94, 0.08);
    border: 1px solid rgba(34, 197, 94, 0.2);
    border-radius: 100px;
    padding: 10px 24px;
    font-size: 15px;
    font-weight: 600;
  }

  .live-dot {
    width: 10px;
    height: 10px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
    50% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
  }

  .live-count {
    color: #22c55e;
    font-weight: 700;
  }

  /* Game Card */
  .game-card {
    background: rgba(34, 197, 94, 0.04);
    border: 1px solid rgba(34, 197, 94, 0.12);
    border-radius: 20px;
    padding: 28px 24px 32px;
  }

  .game-header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .game-icon {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }

  .game-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 70% 20%;
    border-radius: 16px;
  }

  .game-info h3 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .game-rating {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 6px;
  }

  .game-rating .stars {
    font-size: 12px;
  }

  .game-rating .tag {
    color: rgba(255,255,255,0.45);
  }

  .game-pay {
    font-size: 18px;
    font-weight: 700;
    color: #22c55e;
  }

  .how-it-works {
    margin-top: 28px;
  }

  .how-it-works h4 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 20px;
  }

  .steps {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .step-num {
    width: 36px;
    height: 36px;
    background: rgba(34, 197, 94, 0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: #22c55e;
    flex-shrink: 0;
  }

  .step-text {
    font-size: 16px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
  }

  /* Stats Bar */
  .stats-bar {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    display: flex;
    padding: 24px 0;
  }

  .stat {
    flex: 1;
    text-align: center;
    position: relative;
  }

  .stat:not(:last-child)::after {
    content: '';
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 36px;
    width: 1px;
    background: rgba(255,255,255,0.1);
  }

  .stat-value {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .stat-value .star {
    color: #facc15;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.35);
  }

  /* Disclaimer */
  .disclaimer {
    text-align: center;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(255,255,255,0.35);
    padding: 0 8px;
  }

  .legal-links {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 13px;
  }

  .legal-links a {
    color: rgba(255,255,255,0.45);
    text-decoration: none;
  }

  .legal-links a:hover {
    color: rgba(255,255,255,0.7);
  }

  .legal-links .dot {
    color: rgba(255,255,255,0.2);
  }

  /* Sticky Footer */
  .sticky-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, transparent 0%, #0a0a0a 30%);
    padding: 20px 16px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 10;
  }

  .available-text {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
  }

  .available-text .dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
  }

  .store-buttons {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 420px;
  }

  .store-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.15s ease;
  }

  .store-btn:active {
    transform: scale(0.97);
  }

  .store-btn.apple {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
  }

  .store-btn.google {
    background: #22c55e;
    border: 1px solid #22c55e;
    color: #000;
  }

  .store-btn .small-text {
    font-size: 11px;
    font-weight: 400;
    opacity: 0.7;
  }

  .store-btn .big-text {
    font-size: 16px;
    font-weight: 700;
  }

  .store-btn .text-col {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.2;
  }

  .store-btn svg {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
  }

  /* Step 1 - Device Selection */
  #step1 {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    text-align: center;
  }

  #step1 .step1-icon {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    overflow: hidden;
    margin-bottom: 28px;
    box-shadow: 0 8px 32px rgba(34, 197, 94, 0.25);
  }

  #step1 .step1-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 22px;
  }

  #step1 h2 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 10px;
    line-height: 1.2;
  }

  #step1 h2 .green { color: #22c55e; }

  #step1 .step1-sub {
    font-size: 15px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 36px;
    max-width: 300px;
  }

  .device-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 340px;
  }

  .device-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 24px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    font-weight: 700;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .device-btn:active { transform: scale(0.97); }

  .device-btn svg { width: 26px; height: 26px; flex-shrink: 0; }

  .device-btn.ios-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
  }

  .device-btn.android-btn {
    background: #22c55e;
    color: #000;
  }

  .step1-footer {
    margin-top: 40px;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
  }

  /* Step 2 - Main Page */
  #step2 { display: none; }



  /* ===== Above-the-fold: hero + Block Blast offer visible without scrolling ===== */
  #step2 .page-wrapper { padding-top: 16px; gap: 12px; padding-bottom: 130px; }

  #step2 .hero-card { padding: 22px 20px 22px; }
  #step2 .app-icon { width: 68px; height: 68px; border-radius: 16px; margin-bottom: 14px; }
  #step2 .app-icon img { border-radius: 16px !important; }
  #step2 .rating-badge { padding: 6px 14px; margin-bottom: 14px; font-size: 13px; }
  #step2 .hero-title { font-size: 32px; margin-bottom: 10px; }
  #step2 .hero-desc { font-size: 15px; line-height: 1.5; margin-bottom: 16px; }
  #step2 .live-badge { padding: 8px 20px; font-size: 14px; }

  #step2 .game-card { padding: 20px 20px 22px; }
  #step2 .game-header { padding-bottom: 16px; }
  #step2 .game-icon { width: 60px; height: 60px; border-radius: 14px; }
  #step2 .game-info h3 { font-size: 18px; margin-bottom: 4px; }
  #step2 .game-pay { font-size: 17px; }
  #step2 .how-it-works { margin-top: 16px; }
  #step2 .how-it-works h4 { margin-bottom: 12px; }
  #step2 .steps { gap: 10px; }
  #step2 .step-num { width: 30px; height: 30px; border-radius: 8px; font-size: 14px; }
  #step2 .step-text { font-size: 15px; }

  #step2 .sticky-footer { padding: 12px 16px max(16px, env(safe-area-inset-bottom)); gap: 10px; background: #0a0a0a; box-shadow: 0 -20px 20px #0a0a0a; }
  #step2 .legal-links { margin-top: 4px; }

  /* shorter phones: tighten the hero so the offer card still fits */
  @media (max-height: 780px) {
    #step2 .rating-badge { display: none; }
    #step2 .hero-card { padding: 18px 18px; }
    #step2 .app-icon { width: 56px; height: 56px; margin-bottom: 10px; }
    #step2 .hero-title { font-size: 28px; }
    #step2 .hero-desc { margin-bottom: 12px; }
    #step2 .how-it-works h4 { display: none; }
  }
  @media (max-height: 640px) {
    #step2 .hero-card .app-icon { display: none; }
    #step2 .hero-title { font-size: 26px; }
    #step2 .sticky-footer > div:first-child { display: none; }
  }

  /* ===== Info modal shown after tapping a store button ===== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.72);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 16px 16px max(16px, env(safe-area-inset-bottom));
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    position: relative; width: 100%; max-width: 400px;
    background: #111512; border: 1px solid rgba(34,197,94,0.25);
    border-radius: 20px; padding: 26px 22px 20px; text-align: center;
    transform: translateY(24px); transition: transform .25s ease;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-close {
    position: absolute; top: 10px; right: 12px; width: 32px; height: 32px;
    background: none; border: none; color: rgba(255,255,255,0.5);
    font-size: 22px; cursor: pointer; line-height: 1;
  }
  .modal-badge {
    width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 14px;
    background: rgba(34,197,94,0.15); color: #22c55e;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .modal h3 { font-size: 21px; font-weight: 800; line-height: 1.25; margin-bottom: 10px; }
  .modal h3 .green { color: #22c55e; }
  .modal p { font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.72); margin-bottom: 18px; }
  .modal-progress { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .modal-progress span {
    width: 38px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1);
  }
  .modal-progress span:nth-child(-n+3) { background: #22c55e; }
  .modal-progress span:nth-child(n+4) { background: rgba(34,197,94,0.35); }
  .modal-continue {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: #22c55e; color: #000; font-family: inherit;
    font-size: 17px; font-weight: 800; cursor: pointer;
  }
  .modal-continue:active { transform: scale(0.98); }
</style>
</head>
